name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check hosted toolchain
        shell: bash
        run: |
          set -euo pipefail
          for tool in gcc clang clang-tidy make python3 nginx; do
            command -v "$tool" >/dev/null || { echo "missing hosted tool: $tool" >&2; exit 1; }
          done

          llvm_profdata=$(command -v llvm-profdata || command -v llvm-profdata-18 || true)
          llvm_cov=$(command -v llvm-cov || command -v llvm-cov-18 || true)
          [[ -n "$llvm_profdata" ]] || { echo "missing hosted tool: llvm-profdata" >&2; exit 1; }
          [[ -n "$llvm_cov" ]] || { echo "missing hosted tool: llvm-cov" >&2; exit 1; }

          echo "LLVM_PROFDATA=$llvm_profdata" >> "$GITHUB_ENV"
          echo "LLVM_COV=$llvm_cov" >> "$GITHUB_ENV"

      - name: Verify source and runtime
        env:
          FUZZ_RUNS: ${{ github.event_name == 'schedule' && '5000' || '1000' }}
        run: make -j2 verification-check

      - name: Upload coverage report
        if: always() && hashFiles('build/coverage/report.txt') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: build/coverage/report.txt
          archive: false
          if-no-files-found: error
          retention-days: 14

  arm64:
    name: Native ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check hosted toolchain
        shell: bash
        run: |
          set -euo pipefail
          for tool in gcc clang make python3; do
            command -v "$tool" >/dev/null || { echo "missing hosted tool: $tool" >&2; exit 1; }
          done

      - name: Build and test natively on ARM64
        run: make -j2 test release hardening-check bounds-report

  container:
    name: Container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Docker runtime
        run: make container-check
