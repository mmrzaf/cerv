name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build, attest, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          tag=${GITHUB_REF_NAME#v}

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a stable SemVer core (major.minor.patch)" >&2
            exit 1
          fi

          version_re=${version//./\.}
          if [[ "$tag" == "$version" ]]; then
            prerelease=false
          elif [[ "$tag" =~ ^${version_re}-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$ ]]; then
            prerelease=true
          else
            echo "release tag '$GITHUB_REF_NAME' must be v$version or a SemVer prerelease of v$version" >&2
            exit 1
          fi

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'prerelease=%s\n' "$prerelease" >> "$GITHUB_OUTPUT"

      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang clang-tidy llvm nginx python3

      - name: Run release verification
        env:
          FUZZ_RUNS: "5000"
        run: make -j2 verification-check

      - name: Build deterministic source and binary bundles
        run: make release-bundle

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image=$(printf 'ghcr.io/%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          release_tag='${{ steps.release.outputs.tag }}'
          short_sha=${GITHUB_SHA:0:12}

          {
            printf 'name=%s\n' "$image"
            printf 'tags<<EOF\n'
            printf '%s:%s\n' "$image" "$release_tag"
            printf '%s:sha-%s\n' "$image" "$short_sha"
            if [[ "$release_tag" == '${{ steps.release.outputs.version }}' ]]; then
              IFS=. read -r major minor patch <<< "$release_tag"
              printf '%s:%s.%s.%s\n' "$image" "$major" "$minor" "$patch"
              printf '%s:%s.%s\n' "$image" "$major" "$minor"
              printf '%s:%s\n' "$image" "$major"
              printf '%s:latest\n' "$image"
            fi
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-architecture image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.image.outputs.tags }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}

      - name: Attest GHCR image
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Build Docker-loadable amd64 release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          pull: true
          outputs: type=docker,dest=${{ runner.temp }}/cerv-docker-amd64.tar
          provenance: false
          sbom: false

      - name: Package Docker image and release checksums
        shell: bash
        run: |
          set -euo pipefail
          release_tag='${{ steps.release.outputs.tag }}'
          gzip -n -9 < '${{ runner.temp }}/cerv-docker-amd64.tar' > "dist/cerv-${release_tag}-docker-linux-amd64.tar.gz"
          printf '%s\n' '${{ steps.push.outputs.digest }}' > "dist/cerv-${release_tag}-ghcr-digest.txt"
          (
            cd dist
            sha256sum \
              cerv-${{ steps.release.outputs.version }}-source.tar.gz \
              cerv-${{ steps.release.outputs.version }}-linux-x86_64.tar.gz \
              cerv-${release_tag}-docker-linux-amd64.tar.gz \
              cerv-${release_tag}-ghcr-digest.txt \
              > "cerv-${release_tag}-RELEASE-SHA256SUMS"
          )

      - name: Attest release artifacts
        id: attest_artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/cerv-${{ steps.release.outputs.tag }}-RELEASE-SHA256SUMS

      - name: Save artifact attestation bundle
        shell: bash
        run: |
          cp '${{ steps.attest_artifacts.outputs.bundle-path }}' \
            'dist/cerv-${{ steps.release.outputs.tag }}-artifact-attestation.sigstore.json'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease_args=()
          if [[ '${{ steps.release.outputs.prerelease }}' == 'true' ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "Cerv ${{ steps.release.outputs.tag }}" \
              "${prerelease_args[@]}"
          fi
