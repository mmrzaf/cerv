# Example nginx reverse-proxy configuration for Cerv 1.0.
# Keep the upstream pool larger than normal concurrent proxy demand but bounded.
upstream cerv_backend {
    server 127.0.0.1:8080;
    keepalive 128;
}

server {
    listen 80;

    location / {
        proxy_http_version 1.1;
        # Empty Connection permits HTTP/1.1 upstream persistence.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_pass http://cerv_backend;
    }
}
